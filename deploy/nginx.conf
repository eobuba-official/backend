# Reverse proxy in front of the Spring Boot app.
# HTTPS later: add a 443 server block + certs; X-Forwarded-Proto is already
# forwarded and the app runs with server.forward-headers-strategy=framework,
# so no application rework is needed.
server {
    listen 80;
    server_name _;

    # Speech upload: app allows multipart up to 4 MB (nginx default is 1m -> 413).
    client_max_body_size 8m;

    # Bare-root requests hit the JWT filter (401) - redirect to Swagger instead.
    location = / {
        return 302 /swagger-ui.html;
    }

    location / {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # CLOVA STT read-timeout is 65s; nginx default 60s would cut it to 504.
        proxy_read_timeout 90s;
    }
}
