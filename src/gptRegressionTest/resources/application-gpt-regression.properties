# Non-secret defaults for the opt-in GPT regression suite.
# Credentials and proxy URL come from environment variables or the ignored local profile.
piggyback.integrations.llm.chat-completions-path=/chat/completions
piggyback.integrations.llm.primary-model=gpt-5-nano
piggyback.integrations.llm.connect-timeout=PT3S
piggyback.integrations.llm.read-timeout=PT20S
piggyback.classification.confidence-threshold=0.75
piggyback.classification.candidate-floor=0.35
piggyback.classification.candidate-limit=3
piggyback.gpt-regression.report-directory=build/reports/gpt-regression
