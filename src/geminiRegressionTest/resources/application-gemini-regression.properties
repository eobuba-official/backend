# Non-secret defaults for the opt-in Gemini regression suite.
# Credentials come from environment variables or the ignored local profile.
piggyback.integrations.gemini.base-url=https://generativelanguage.googleapis.com/v1beta
piggyback.integrations.gemini.model=gemini-3.5-flash-lite
piggyback.integrations.gemini.connect-timeout=PT3S
piggyback.integrations.gemini.read-timeout=PT20S
piggyback.integrations.gemini.max-retries=0
piggyback.integrations.gemini.retry-delay=PT1S
piggyback.integrations.gemini.requests-per-minute=15
piggyback.integrations.gemini.requests-per-day=500
piggyback.integrations.gemini.quota-zone=America/Los_Angeles
piggyback.classification.confidence-threshold=0.75
piggyback.classification.candidate-floor=0.35
piggyback.classification.candidate-limit=3
piggyback.gemini-regression.request-interval=PT4S
piggyback.gemini-regression.report-directory=build/reports/gemini-regression
