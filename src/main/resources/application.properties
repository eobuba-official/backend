spring.application.name=backend

# Recommendation
# 도보 시간 환산용 보행 속도(km/h). totalMinutes = 거리 ÷ 속도 × 60 + 예상 대기
piggyback.recommendation.walking-speed-kmh=4
piggyback.recommendation.result-limit=3
piggyback.recommendation.search-radius-km=10
piggyback.recommendation.default-wait-minutes=15
piggyback.recommendation.planning-business-days=2

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/piggyback?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD}

# JPA
# 스키마 원본은 docs/schema.sql (v1.2). ddl-auto=update는 해커톤 로컬 편의용이며
# 엔티티 변경 시 docs/schema.sql도 함께 갱신할 것.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Task classification
piggyback.classification.confidence-threshold=0.75
piggyback.classification.candidate-floor=0.35
piggyback.classification.candidate-limit=3

# Gemini task classification
piggyback.integrations.gemini.base-url=https://generativelanguage.googleapis.com/v1beta
piggyback.integrations.gemini.api-key=${GEMINI_API_KEY:}
piggyback.integrations.gemini.model=gemini-3.5-flash-lite
piggyback.integrations.gemini.connect-timeout=3s
piggyback.integrations.gemini.read-timeout=20s
piggyback.integrations.gemini.max-retries=1
piggyback.integrations.gemini.retry-delay=1s
piggyback.integrations.gemini.requests-per-minute=15
piggyback.integrations.gemini.requests-per-day=500
piggyback.integrations.gemini.quota-zone=America/Los_Angeles

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Speech upload (CLOVA CSR limit: 3 MB)
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB
spring.servlet.multipart.file-size-threshold=3MB

# Auth
abuba.auth.sms-code-ttl-seconds=180
abuba.auth.sms-request-cooldown-seconds=30
abuba.auth.sms-max-verify-attempts=5
abuba.auth.access-token-ttl-hours=24
abuba.auth.signup-token-ttl-minutes=10
# 기본값 없음 - 미설정 시 기동 실패 (local 프로파일 또는 환경변수로 주입)
abuba.auth.jwt-secret=${JWT_SECRET}
abuba.auth.expose-mock-code=${EXPOSE_MOCK_CODE:false}

# Guardian (가족 등록 안내 문자의 수신 거부 링크 - 프론트 라우트 확정 시 교체)
abuba.guardian.decline-base-url=${GUARDIAN_DECLINE_BASE_URL:http://localhost:5173/guardian-decline}
