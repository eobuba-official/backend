spring.application.name=backend

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/piggyback?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Auth
abuba.auth.sms-code-ttl-seconds=180
abuba.auth.access-token-ttl-hours=24
abuba.auth.signup-token-ttl-minutes=10
abuba.auth.jwt-secret=${JWT_SECRET:piggyback-abuba-hackathon-2026-jwt-secret-key-must-be-long}
abuba.auth.expose-mock-code=${EXPOSE_MOCK_CODE:true}