spring.application.name=backend

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/piggyback?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Task classification
piggyback.classification.confidence-threshold=0.75
piggyback.classification.candidate-floor=0.35
piggyback.classification.candidate-limit=3

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
