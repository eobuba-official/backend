# Production profile - EC2 docker-compose deployment.
# Activated by SPRING_PROFILES_ACTIVE=prod (set in deploy/docker-compose.prod.yml).
# All secrets come from environment variables via /opt/piggyback/.env on the EC2
# host; nothing in this file is sensitive. Setup guide: docs/DEPLOYMENT.md

# Behind nginx - honor X-Forwarded-* so HTTPS can be added without rework.
server.forward-headers-strategy=framework

# MySQL - overrides the hardcoded localhost URL in application.properties.
# "mysql" is the docker-compose service name.
spring.datasource.url=jdbc:mysql://mysql:3306/piggyback?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD}
# Free tier: small pool (max-connections=30 on the MySQL side).
spring.datasource.hikari.maximum-pool-size=5

# Quieter logs on the demo box.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Auth - required; the container fails fast when JWT_SECRET is missing.
abuba.auth.jwt-secret=${JWT_SECRET}
abuba.auth.expose-mock-code=${EXPOSE_MOCK_CODE:false}

# External integrations - all optional. Empty values keep the app bootable;
# the clients fail lazily on first use (LlmProperties defaults are blank).
piggyback.integrations.llm.api-key=${LLM_API_KEY:}
piggyback.integrations.clova-csr.api-key-id=${CLOVA_API_KEY_ID:}
piggyback.integrations.clova-csr.api-key=${CLOVA_API_KEY:}
# NOTE: finmap / seoul-city-data / juso have no @ConfigurationProperties
# consumer yet (mirrors application-local.properties.example) - inert until
# those integrations are implemented.
piggyback.integrations.finmap.api-key=${FINMAP_API_KEY:}
piggyback.integrations.seoul-city-data.api-key=${SEOUL_API_KEY:}
piggyback.integrations.juso.confirmation-key=${JUSO_CONFIRMATION_KEY:}
